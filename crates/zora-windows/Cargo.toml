[package]
name = "zora-windows"
version.workspace = true
edition.workspace = true
description = "Windows plugins for zorad: dictation monitor on WASAPI audio sessions (zora-win-dictation), notifications and tray (zora-tray)"

# Watches capture audio sessions for the configured dictation apps.
[[bin]]
name = "zora-win-dictation"
path = "src/bin/zora-win-dictation.rs"

# Tray icon and notifications.
[[bin]]
name = "zora-tray"
path = "src/bin/zora-tray.rs"

[dependencies]
zora-plugin = { path = "../zora-plugin" }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }
# The `implement` macro for the WASAPI callbacks expands to `windows_core` paths.
windows-core = "0.62"
windows-sys = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
