[package]
name = "zorad"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zorad"
path = "src/main.rs"

# Reference plugin that replays a script; used by the end-to-end tests.
[[bin]]
name = "zora-script-plugin"
path = "src/bin/script_plugin.rs"

[dependencies]
zora-core = { path = "../zora-core" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
uuid.workspace = true

[dev-dependencies]
rusqlite.workspace = true
