[workspace]
resolver = "3"
members = ["crates/zora-core", "crates/zorad"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
unicode-normalization = "0.1"
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "sync", "signal", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
