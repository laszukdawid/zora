[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zora-agent"
version = "0.1.0"
description = "Local voice-triggered coding agent dispatcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "sounddevice>=0.4.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
zora = "zora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
