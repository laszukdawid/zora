name: Release

# Push a tag like v0.3.0 (matching the Cargo workspace version) to build, sign, notarize and publish
# Zora-<version>.dmg as a draft GitHub release. docs/development.md#releases lists the secrets and the
# repository settings that keep them safe.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # No secrets here: this job compiles the tagged code.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check the tagged commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [[ "$status" != identical && "$status" != behind ]]; then
            echo "$GITHUB_SHA is not on main ($status)." >&2
            exit 1
          fi
          # The CI workflow must have passed for this exact commit, pushed to main.
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" \
            --jq .total_count)
          if [[ "$passed" -lt 1 ]]; then
            echo "CI (ci.yml) has not passed on main for $GITHUB_SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Build Zora.app (unsigned)
        run: |
          packaging/macos/bundle.sh --no-sign
          tar -C .build -cf Zora.app.tar Zora.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-app
          path: Zora.app.tar
          # Long enough for the release approval to wait over a weekend.
          retention-days: 7

  sign:
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    # Holds the secrets; protect it with required reviewers (docs/development.md#releases).
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-app
      - name: Sign, notarize and staple
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          ZORA_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ZORA_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          secrets=$(mktemp -d "$RUNNER_TEMP/secrets.XXXXXX")
          export ZORA_KEYCHAIN="$secrets/signing.keychain-db"
          cleanup() { security delete-keychain "$ZORA_KEYCHAIN" 2>/dev/null || true; rm -rf "$secrets"; }
          trap cleanup EXIT

          password=$(uuidgen)
          printf '%s' "$CERT_P12" | base64 --decode > "$secrets/cert.p12"
          printf '%s' "$NOTARY_KEY" > "$secrets/notary.p8"
          export ZORA_NOTARY_KEY="$secrets/notary.p8"
          # Only the credentials need the private umask; the app keeps normal permissions.
          umask 022
          security create-keychain -p "$password" "$ZORA_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$ZORA_KEYCHAIN"
          security unlock-keychain -p "$password" "$ZORA_KEYCHAIN"
          security import "$secrets/cert.p12" -k "$ZORA_KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$secrets/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$ZORA_KEYCHAIN" >/dev/null
          # codesign is pointed at this keychain; it is also searched so the certificate chain resolves.
          searched=()
          while IFS= read -r k; do k=${k#*\"}; searched+=("${k%\"}"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$ZORA_KEYCHAIN" "${searched[@]}"
          ZORA_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$ZORA_KEYCHAIN" |
            awk '/Developer ID Application/ { print $2; exit }')
          [[ -n "$ZORA_SIGN_IDENTITY" ]] || { echo "No Developer ID identity in MACOS_CERT_P12" >&2; exit 1; }
          export ZORA_SIGN_IDENTITY

          tar -C "$secrets" -xf Zora.app.tar
          packaging/macos/release.sh "$secrets/Zora.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dmg
          path: dist/
          retention-days: 7

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dmg
          path: dist
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag must still point at the commit that was built; never let gh create or move it.
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          if [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "$GITHUB_REF_NAME now points at $tagged, not the built $GITHUB_SHA." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/Zora-*.dmg dist/Zora-*.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Zora ${GITHUB_REF_NAME#v}" --generate-notes
