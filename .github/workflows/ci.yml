name: CI

# Lints and a build check. Tests run locally (see CONTRIBUTING.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config clang libclang-dev libasound2-dev libpipewire-0.3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift build
